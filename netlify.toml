# netlify.toml

[build]
# stop annoying Netlify build halt due to secrets check
  ignore = "git diff --quiet $COMMIT_REF ../.. && git diff --quiet HEAD HEAD~1 -- exampleSite"
  command = "hugo mod get -u && hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  NODE_ENV = "production"
  GO_VERSION = "1.22.2"
  TZ = "Australia/Brisbane (AEST, +1000)"  # Set to preferred timezone

[context.production.environment]
  HUGO_VERSION = "0.164.0"
  HUGO_ENV = "production"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.164.0"